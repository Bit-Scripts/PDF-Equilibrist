name: Update softwareVersion on gh-pages

on:
  push:
    tags: ['v*']

jobs:
  update_version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Mettre à jour softwareVersion dans index.html
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          sed -i "s/\"softwareVersion\": \"[^\"]*\"/\"softwareVersion\": \"$VERSION\"/" index.html
          echo "softwareVersion mis à jour : $VERSION"

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: softwareVersion → ${{ github.ref_name }}"
          git push origin gh-pages
