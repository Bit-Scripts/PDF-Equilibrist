name: Linux AppImage (prototype)

# PROTOTYPE — canal « autres distributions » : un seul fichier .AppImage à télécharger.
# Ne publie RIEN : pas de déclenchement sur tag, pas d'envoi vers la release. Le résultat est un
# artefact de run (14 jours) à tester à la main. Lancement : onglet Actions › « Linux AppImage
# (prototype) » › Run workflow, ou automatiquement quand packaging/appimage/ change dans une PR.
#
# Construit sur Ubuntu 22.04 (glibc 2.35) : un binaire construit sur un système ancien tourne sur
# les récents, pas l'inverse. L'AppImage est ensuite lancée dans plusieurs distributions vierges.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packaging/appimage/**'
      - '.github/workflows/linux-appimage.yml'

env:
  APPIMAGETOOL_VERSION: '1.9.1'
  # SHA-256 du binaire de la release officielle AppImage/appimagetool 1.9.1 (épinglé : on n'exécute
  # jamais un binaire téléchargé sans l'avoir vérifié)
  APPIMAGETOOL_SHA256: 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'

jobs:
  build:
    name: Build AppImage (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system libraries (Qt6/xcb, offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 binutils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download appimagetool (pinned and verified)
        run: |
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool

      - name: Build the AppDir and the AppImage
        env:
          PYTHON: python
        run: |
          APPIMAGETOOL="$PWD/appimagetool" bash packaging/appimage/build_appimage.sh
          ls -la build/appimage/*.AppImage

      # Environnement minimal et HOME vide : ce que verrait un utilisateur sur une machine vierge.
      - name: OCR selftest on the AppImage (offline, empty home)
        run: |
          H="$(mktemp -d)"
          env -i HOME="$H" PATH=/usr/bin:/bin APPIMAGE_EXTRACT_AND_RUN=1 \
            build/appimage/PDF-Equilibrist-x86_64.AppImage --ocr-selftest "$H/report.txt" || { cat "$H/report.txt"; exit 1; }
          cat "$H/report.txt"
          # Informatif : en local (Ubuntu 24.04) un dossier ~/.cache apparaît pendant le selftest ; on veut
          # savoir quel composant l'écrit (aucun fichier utilisateur ne doit contenir de document).
          echo "Fichiers créés dans HOME hors rapport :"
          find "$H" -mindepth 1 ! -name report.txt | head -20 || true

      - name: GUI starts offscreen and stays up
        run: |
          H="$(mktemp -d)"
          set +e
          env -i HOME="$H" PATH=/usr/bin:/bin APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen \
            timeout 15 build/appimage/PDF-Equilibrist-x86_64.AppImage > "$H/run.log" 2>&1
          rc=$?
          cat "$H/run.log" | tail -20
          # 124 = toujours en cours d'exécution au bout de 15 s = démarrage réussi
          test "$rc" = 124

      - name: Summary
        run: |
          {
            echo "### AppImage (prototype)"
            echo "- Taille : $(du -h build/appimage/PDF-Equilibrist-x86_64.AppImage | cut -f1)"
            echo "- sha256 : \`$(sha256sum build/appimage/PDF-Equilibrist-x86_64.AppImage | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Equilibrist-x86_64.AppImage
          path: build/appimage/PDF-Equilibrist-x86_64.AppImage
          retention-days: 14

  # La même AppImage, lancée dans des distributions vierges (sans Python ni aucune dépendance de l'appli)
  distros:
    name: Run on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'ubuntu:24.04', 'fedora:44', 'archlinux:latest', 'opensuse/tumbleweed']
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Download the AppImage
        uses: actions/download-artifact@v4
        with:
          name: PDF-Equilibrist-x86_64.AppImage

      - name: OCR selftest (no Python, no network used, fresh distribution)
        run: |
          chmod +x PDF-Equilibrist-x86_64.AppImage
          . /etc/os-release; echo "== $PRETTY_NAME"; command -v python3 || echo "(pas de python3 : normal)"
          export HOME="$(mktemp -d)" APPIMAGE_EXTRACT_AND_RUN=1
          ./PDF-Equilibrist-x86_64.AppImage --ocr-selftest "$HOME/report.txt" || { cat "$HOME/report.txt" 2>/dev/null; exit 1; }
          cat "$HOME/report.txt"
