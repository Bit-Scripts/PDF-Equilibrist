name: Checks

# Contrôles obligatoires (lint, analyse de sécurité, tests) — workflow réutilisable.
# Appelé par ci.yml et par TOUS les workflows qui construisent ou publient une
# release (release, AUR, COPR, PPA, site) : si un contrôle échoue, rien n'est publié.

on:
  workflow_call:

jobs:
  checks:
    name: Lint, Bandit, tests
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Flake8 (bloquant — configuration dans .flake8)
        run: flake8 src tests

      - name: Bandit (analyse de sécurité du code)
        run: bandit -r src -q

      - name: Tests
        run: pytest -q
