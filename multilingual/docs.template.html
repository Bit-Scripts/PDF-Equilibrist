<!doctype html>
<html lang="{{html.lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{docs.meta.title}}</title>
<meta name="description" content="{{docs.meta.description}}">
<link rel="icon" href="{{docs.base.url}}assets/logo/PDF-Equilibrist-logo.png">
<link rel="stylesheet" href="{{docs.base.url}}style.css">
</head>
<body>

<div class="topnav">
  <div class="brand">
    <img src="{{docs.base.url}}assets/logo/PDF-Equilibrist-logo.png" alt="{{img.logo.alt}}">
    PDF-Equilibrist
  </div>
  <nav>
    <a href="{{docs.nav.home.url}}">{{nav.home}}</a>
    <a href="{{docs.nav.features.url}}">{{nav.features}}</a>
    <a href="./" class="active">{{nav.docs}}</a>
    <a href="https://github.com/Bit-Scripts/PDF-Equilibrist">GitHub</a>
    <span class="lang-switch">
      <a href="{{lang.fr.url}}" class="{{lang.fr.class}}">FR</a><a href="{{lang.en.url}}" class="{{lang.en.class}}">EN</a>
    </span>
  </nav>
</div>

<div class="lang-banner" id="lang-banner" hidden>
  <div class="container">
    <span id="lang-banner-msg"></span>
    <a href="#" id="lang-banner-switch" class="btn btn-primary"></a>
    <button type="button" id="lang-banner-close" aria-label="Close">×</button>
  </div>
</div>

<div class="docs-layout">
  <aside class="docs-sidebar">
    <h4>{{nav.docs}}</h4>
    <div id="doc-links"></div>
  </aside>
  <main class="docs-content" id="doc-content">
    <p class="docs-loading">{{docs.loading}}</p>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const DOCS = [
  { file: "1.INDEX.md",        title: "{{docs.file1.title}}" },
  { file: "2.ARCHITECTURE.md", title: "{{docs.file2.title}}" },
  { file: "3.CONTRIBUTING.md", title: "{{docs.file3.title}}" },
  { file: "4.OPERATIONS.md",   title: "{{docs.file4.title}}" },
  { file: "5.BUILD.md",        title: "{{docs.file5.title}}" },
  { file: "6.SECURITE.md",     title: "{{docs.file6.title}}" },
];

const linksEl = document.getElementById("doc-links");
const contentEl = document.getElementById("doc-content");

DOCS.forEach(doc => {
  const a = document.createElement("a");
  a.href = "#" + doc.file;
  a.textContent = doc.title;
  a.dataset.file = doc.file;
  linksEl.appendChild(a);
});

function currentFile() {
  const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
  const known = DOCS.find(d => d.file === hash);
  return known ? known.file : DOCS[0].file;
}

async function loadDoc(file) {
  contentEl.innerHTML = '<p class="docs-loading">{{docs.loading}}</p>';
  try {
    const res = await fetch(file);
    if (!res.ok) throw new Error(res.status);
    const md = await res.text();
    contentEl.innerHTML = marked.parse(md);
  } catch (err) {
    contentEl.innerHTML = '<p class="docs-loading">{{docs.error.load}} ' + file + ' (' + err + ')</p>';
  }
  [...linksEl.children].forEach(a => a.classList.toggle("active", a.dataset.file === file));
  document.title = "{{docs.meta.title}}";
}

contentEl.addEventListener("click", (e) => {
  const a = e.target.closest("a");
  if (!a) return;
  const href = a.getAttribute("href") || "";
  const match = href.match(/^(?:\.\/)?([\w.]+\.md)(#.*)?$/);
  if (match && DOCS.some(d => d.file === match[1])) {
    e.preventDefault();
    location.hash = match[1];
  }
});

window.addEventListener("hashchange", () => loadDoc(currentFile()));
loadDoc(currentFile());

// Bandeau de suggestion de langue — même logique que sur la page d'accueil.
(function () {
  var CUR = document.documentElement.lang;
  var OTHER = CUR === "fr" ? "en" : "fr";
  var TXT = {
    fr: { avail: "Ce site est aussi disponible en français.", switchLabel: "Basculer en français" },
    en: { avail: "This site is also available in English.", switchLabel: "Switch to English" },
  };
  try {
    if (localStorage.getItem("langBannerDismissed") === "1") return;
    var detected = ((navigator.language || "") + "").slice(0, 2).toLowerCase();
    if (detected === CUR) return;

    var otherLink = document.querySelector(".lang-switch a[href]:not(.lang-current)");
    if (!otherLink) return;

    var banner = document.getElementById("lang-banner");
    document.getElementById("lang-banner-msg").textContent = TXT[OTHER].avail;
    var switchLink = document.getElementById("lang-banner-switch");
    switchLink.textContent = TXT[OTHER].switchLabel;
    switchLink.href = otherLink.getAttribute("href");
    banner.hidden = false;

    document.getElementById("lang-banner-close").addEventListener("click", function () {
      banner.hidden = true;
      try { localStorage.setItem("langBannerDismissed", "1"); } catch (e) {}
    });
  } catch (e) { /* localStorage indisponible : pas de bandeau, pas grave */ }
})();
</script>

</body>
</html>
